      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Build debug APK
        working-directory: proj
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            m1=$(grep -E '^e: ' build.log | head -12 | sed 's#file:///home/runner/work/[^/]*/[^/]*/proj/##' | tr '\n' '|')
            echo "::error title=KotlinErrors::$m1"
            m2=$(sed -n '/What went wrong/,/Try:/p' build.log | head -15 | tr '\n' '|')
            echo "::error title=WhatWentWrong::$m2"
            m3=$(tail -25 build.log | tr '\n' '|')
            echo "::error title=LogTail::$m3"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: StakeHelper-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
